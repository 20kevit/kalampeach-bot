[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kalampeach-bot"
version = "0.2.0"
description = "Standalone KalamPeach Telegram operations bot (cPanel WSGI + cron worker)"
requires-python = ">=3.9"
# The runtime has no third-party dependencies on purpose: cPanel shared hosting
# should only need the Python interpreter and its standard library.
dependencies = []

[tool.setuptools]
packages = ["kalampeach", "kalampeach.ai", "kalampeach.telegram", "kalampeach.services", "kalampeach.web", "kalampeach.migrations"]

[tool.setuptools.package-data]
"kalampeach.migrations" = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:kalampeach.*"]
